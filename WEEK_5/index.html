<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 5 - Student Registration Form</title>
</head>
<body>
    <nav>
        <a href="index.html">Registration Form</a> |
        <a href="login.html">Login Form</a> |
        <a href="feedback.html">Feedback Form</a>
    </nav>
    <hr>

    <h2>Student Registration Form</h2>

    <form action="#" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter Full Name" required>
        <br><br>

        <label for="regno">Registration Number:</label>
        <input type="text" id="regno" name="regno" placeholder="e.g. 261FD01035" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select Course</option>
            <option value="BCA">BCA</option>
            <option value="MCA" selected>MCA</option>
            <option value="B.Tech">B.Tech</option>
            <option value="M.Tech">M.Tech</option>
        </select>
        <br><br>

        <label>Skills:</label>
        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>
        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label>
        <input type="checkbox" id="html" name="skills" value="HTML" checked>
        <label for="html">HTML</label>
        <input type="checkbox" id="sql" name="skills" value="SQL">
        <label for="sql">SQL</label>
        <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address" required></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>
    <hr>
    <footer>
        <p>Submitted by: <strong>Deepak Surya</strong> (Reg No: <strong>261FD01035</strong>)</p>
    </footer>
</body>
</html>
