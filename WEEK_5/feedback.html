<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 5 - Feedback Form</title>
</head>
<body>
    <nav>
        <a href="index.html">Registration Form</a> |
        <a href="login.html">Login Form</a> |
        <a href="feedback.html">Feedback Form</a>
    </nav>
    <hr>

    <h2>Feedback Form</h2>

    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter Name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        <br><br>

        <label>Rating:</label>
        <input type="radio" id="r_exc" name="rating" value="Excellent" required>
        <label for="r_exc">Excellent</label>
        <input type="radio" id="r_good" name="rating" value="Good">
        <label for="r_good">Good</label>
        <input type="radio" id="r_avg" name="rating" value="Average">
        <label for="r_avg">Average</label>
        <input type="radio" id="r_poor" name="rating" value="Poor">
        <label for="r_poor">Poor</label>
        <br><br>

        <label>What did you like?</label><br>
        <input type="checkbox" id="chk_content" name="like" value="Content">
        <label for="chk_content">Content</label>
        <input type="checkbox" id="chk_teaching" name="like" value="Teaching">
        <label for="chk_teaching">Teaching</label>
        <input type="checkbox" id="chk_activities" name="like" value="Activities">
        <label for="chk_activities">Activities</label>
        <br><br>

        <label for="feedback">Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="5" cols="40" placeholder="Write your comments here..." required></textarea>
        <br><br>

        <input type="submit" value="Submit Feedback">
        <input type="reset" value="Reset">
    </form>
    <hr>
    <footer>
        <p>Submitted by: <strong>Deepak Surya</strong> (Reg No: <strong>261FD01035</strong>)</p>
    </footer>
</body>
</html>
