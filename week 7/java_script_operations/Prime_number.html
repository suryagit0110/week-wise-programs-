<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>

let n = 7;
let prime = true;

if (n < 2) {
    prime = false;
} else {
    for (let i = 2; i <= Math.sqrt(n); i++) {
        if (n % i === 0) {
            prime = false;
            break;
        }
    }
}

if (prime) {
    console.log(n + " is a Prime Number");
} else {
    console.log(n + " is Not a Prime Number");
}

</script>

</body>
</html>
