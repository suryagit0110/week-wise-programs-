<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
   
let n = 121;
let original = n;
let reverse = 0;

while (n > 0) {
    let digit = n % 10;
    reverse = reverse * 10 + digit;
    n = Math.floor(n / 10);
}

if (reverse === original) {
    console.log(original + " is a Palindrome");
} else {
    console.log(original + " is Not a Palindrome");
}
    </script>
</body>
</html>
